<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="100%">
  <defs>
    <!-- Dark Gold / Bronze Line Accent -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6D3B"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8C6D3B"/>
    </linearGradient>
  </defs>

  <g stroke="url(#goldGradient)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Main Rectangle Border -->
    <rect x="70" y="15" width="660" height="90" rx="8" stroke-width="3"/>

    <!-- Inner Double Border -->
    <rect x="80" y="23" width="640" height="74" rx="4" stroke-width="1.5"/>

    <!-- Corner Decorative Accents -->
    <!-- Top-Left Corner Ornament -->
    <path d="M 80 38 L 95 38 L 95 23" stroke-width="2"/>
    <circle cx="103" cy="46" r="3" fill="#8C6D3B"/>

    <!-- Top-Right Corner Ornament -->
    <path d="M 720 38 L 705 38 L 705 23" stroke-width="2"/>
    <circle cx="697" cy="46" r="3" fill="#8C6D3B"/>

    <!-- Bottom-Left Corner Ornament -->
    <path d="M 80 82 L 95 82 L 95 97" stroke-width="2"/>
    <circle cx="103" cy="74" r="3" fill="#8C6D3B"/>

    <!-- Bottom-Right Corner Ornament -->
    <path d="M 720 82 L 705 82 L 705 97" stroke-width="2"/>
    <circle cx="697" cy="74" r="3" fill="#8C6D3B"/>

    <!-- Left Side Arabesque End-Cap Motif -->
    <g stroke-width="2">
      <!-- Outer Arcs -->
      <path d="M 70 25 C 20 25, 20 95, 70 95"/>
      <path d="M 70 35 C 35 35, 35 85, 70 85" stroke-dasharray="2,2"/>
      <!-- Center Star / Diamond -->
      <polygon points="40,60 48,52 56,60 48,68" fill="#8C6D3B"/>
      <circle cx="28" cy="60" r="2.5" fill="#8C6D3B"/>
    </g>

    <!-- Right Side Arabesque End-Cap Motif -->
    <g stroke-width="2">
      <!-- Outer Arcs -->
      <path d="M 730 25 C 780 25, 780 95, 730 95"/>
      <path d="M 730 35 C 765 35, 765 85, 730 85" stroke-dasharray="2,2"/>
      <!-- Center Star / Diamond -->
      <polygon points="760,60 752,52 744,60 752,68" fill="#8C6D3B"/>
      <circle cx="772" cy="60" r="2.5" fill="#8C6D3B"/>
    </g>

    <!-- Top & Bottom Center Crests -->
    <path d="M 380 15 L 400 3 L 420 15" stroke-width="2" fill="none"/>
    <circle cx="400" cy="9" r="2" fill="#8C6D3B"/>

    <path d="M 380 105 L 400 117 L 420 105" stroke-width="2" fill="none"/>
    <circle cx="400" cy="111" r="2" fill="#8C6D3B"/>
  </g>
</svg>
